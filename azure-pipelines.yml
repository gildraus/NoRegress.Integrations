# Live test of the NoRegress Azure DevOps task, run by hand in our own Azure DevOps organization.
# Needs: the extension installed in the organization, a self-hosted agent in the Default pool (the demo PC),
# and the secret pipeline variable NoRegressApiKey. See docs/owner-setup.md.

trigger: none
pr: none

parameters:
  - name: nordlys
    displayName: Also run the Nordlys suites (semantic rules; slow on the demo judge)
    type: boolean
    default: true

pool:
  name: Default

jobs:
  - job: live
    timeoutInMinutes: 120
    steps:
      - checkout: self

      - task: NoRegress@1
        displayName: Exact rules only (expects passed)
        inputs:
          suite: examples/deterministic.json
          apiKey: $(NoRegressApiKey)
          junitFile: out/deterministic.xml

      - ${{ if parameters.nordlys }}:
          - task: NoRegress@1
            displayName: Nordlys good (expects passed)
            inputs:
              suite: examples/nordlys/good.json
              apiKey: $(NoRegressApiKey)
              junitFile: out/good.xml

          - task: NoRegress@1
            name: regressed
            displayName: Nordlys regressed-after-pr (expects failed)
            continueOnError: true
            inputs:
              suite: examples/nordlys/regressed-after-pr.json
              apiKey: $(NoRegressApiKey)
              junitFile: out/regressed-after-pr.xml

          - pwsh: |
              Write-Host "regressed-after-pr: outcome $env:OUTCOME, $env:FAILED failed cases"
              if ($env:OUTCOME -ne 'failed' -or [int]$env:FAILED -lt 1) {
                Write-Host "##vso[task.logissue type=error]The regression was not caught."
                exit 1
              }
            displayName: Check that the regression was caught
            condition: succeededOrFailed()
            env:
              OUTCOME: $(regressed.outcome)
              FAILED: $(regressed.failedCases)
