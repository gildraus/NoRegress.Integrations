name: NoRegress
description: Evaluate a suite of AI outputs with NoRegress and fail the workflow when the AI got worse.
author: Miloš Vujčić
branding:
  icon: check-circle
  color: purple

inputs:
  suite:
    description: Path to the suite file, relative to the repository root. The file is a POST /evaluate request body with a "cases" array.
    required: true
  api-key:
    description: NoRegress API key. Pass it from a GitHub Actions secret.
    required: true
  service-url:
    description: Base URL of the NoRegress API, without /evaluate. Set it only for a self-hosted API.
    required: false
    default: https://api.noregress.dev
  batch-size:
    description: Maximum cases per request. Match the API's case limit if a self-hosted API changed it.
    required: false
    default: "50"
  junit-file:
    description: Where to write the JUnit XML results, relative to the repository root.
    required: false
    default: noregress-results.xml

outputs:
  outcome:
    description: passed or failed. An incomplete evaluation is failed.
  cases:
    description: Number of cases evaluated.
  passed-cases:
    description: Number of passed cases.
  failed-cases:
    description: Number of failed cases.
  inconclusive-cases:
    description: Number of cases the judge could not grade.
  not-graded-cases:
    description: Number of cases whose rules were all skipped.
  junit-file:
    description: Absolute path of the JUnit XML file.

runs:
  using: node24
  main: src/github.js
