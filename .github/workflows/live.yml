name: Live

# Runs the action against the real NoRegress API. Needs the repository secret NOREGRESS_API_KEY.
# Pull requests and forks never get the secret, so this runs only on main and by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nordlys:
        description: Also run the Nordlys suites (semantic rules; slow on the demo judge)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  deterministic:
    name: Exact rules only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        id: secret
        env:
          KEY: ${{ secrets.NOREGRESS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::NOREGRESS_API_KEY is not set, so the live test is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate examples/deterministic.json
        if: steps.secret.outputs.present == 'true'
        uses: ./
        with:
          suite: examples/deterministic.json
          api-key: ${{ secrets.NOREGRESS_API_KEY }}

  nordlys:
    name: Nordlys suites
    if: github.event_name == 'workflow_dispatch' && inputs.nordlys
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Good version (expects passed)
        uses: ./
        with:
          suite: examples/nordlys/good.json
          api-key: ${{ secrets.NOREGRESS_API_KEY }}
          junit-file: out/good.xml
      - name: Regressed version (expects failed)
        id: regressed
        continue-on-error: true
        uses: ./
        with:
          suite: examples/nordlys/regressed-after-pr.json
          api-key: ${{ secrets.NOREGRESS_API_KEY }}
          junit-file: out/regressed-after-pr.xml
      - name: Check that the regression was caught
        env:
          OUTCOME: ${{ steps.regressed.outputs.outcome }}
          FAILED: ${{ steps.regressed.outputs.failed-cases }}
        run: |
          echo "regressed-after-pr: outcome $OUTCOME, $FAILED failed cases"
          test "$OUTCOME" = failed
          test "$FAILED" -ge 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: out/
